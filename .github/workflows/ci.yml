name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: [main]

  workflow_dispatch:
    inputs:
      release_tag:
        description: "Существующий тег для публикации релиза"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Получение исходного кода
        uses: actions/checkout@v7
      - name: Установка зависимостей
        run: |
          sudo apt-get update
          xargs -a build-deps.txt sudo apt-get install -y
      - name: Конфигурация CMake
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_FLAGS=-Werror
          -DBUILD_TESTING=OFF
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: Сборка программы
        run: cmake --build build
      - name: Статический анализ
        run: >
          cppcheck
          --project=build/compile_commands.json
          --enable=warning,style,performance
          --error-exitcode=1 -q

  test:
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - name: Получение исходного кода
        uses: actions/checkout@v7

      - name: Установка зависимостей
        run: |
          sudo apt-get update
          xargs -a build-deps.txt sudo apt-get install -y

      - name: Конфигурация тестовой сборки
        run: |
          cmake -S . -B build/test \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTING=ON \
            "-DCMAKE_C_FLAGS=--coverage -fsanitize=address,undefined -fno-omit-frame-pointer" \
            "-DCMAKE_EXE_LINKER_FLAGS=--coverage -fsanitize=address,undefined"

      - name: Сборка тестов
        run: cmake --build build/test

      - name: Запуск тестов CTest
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build/test --output-on-failure --output-junit junit.xml

      - name: Проверка покрытия кода
        run: gcovr --root . --filter src/core.c --fail-under-line 70 build/test

      - name: Сохранение отчета тестирования
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: build/test/junit.xml
          if-no-files-found: warn

  package:
    needs: test
    runs-on: ubuntu-24.04

    steps:
      - name: Получение исходного кода
        uses: actions/checkout@v7

      - name: Установка зависимостей
        run: |
          sudo apt-get update
          xargs -a build-deps.txt sudo apt-get install -y

      - name: Проверка версии при ручном запуске
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [ "$RELEASE_TAG" != "v$(cat VERSION)" ]; then
            echo "Version mismatch: VERSION=$(cat VERSION), tag=$RELEASE_TAG" >&2
            exit 1
          fi

      - name: Сборка Debian-пакета
        run: ./build_deb.sh

      - name: Проверка пакета lintian
        run: lintian --fail-on error dist/*.deb

      - name: Сохранение Debian-пакета
        uses: actions/upload-artifact@v7
        with:
          name: deb
          path: dist/*.deb
          if-no-files-found: error

  kubernetes:
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    defaults:
      run:
        shell: bash

    steps:
      - name: Получение исходного кода
        uses: actions/checkout@v7

      - name: Скачивание Debian-пакета
        uses: actions/download-artifact@v8
        with:
          name: deb
          path: dist

      - name: Сборка Docker-образа
        run: |
          APP_VERSION="$(cat VERSION)"
          IMAGE="jsoncheck-ci:$APP_VERSION"

          docker build \
            --build-arg APP_VERSION="$APP_VERSION" \
            -t "$IMAGE" .

          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Установка kind и kubectl
        run: |
          mkdir -p "$RUNNER_TEMP/bin"

          curl -fsSL --retry 3 \
            https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64 \
            -o "$RUNNER_TEMP/bin/kind"

          curl -fsSL --retry 3 \
            https://dl.k8s.io/release/v1.37.0/bin/linux/amd64/kubectl \
            -o "$RUNNER_TEMP/bin/kubectl"

          chmod +x "$RUNNER_TEMP/bin/kind" "$RUNNER_TEMP/bin/kubectl"

          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          echo "KUBECONFIG=$RUNNER_TEMP/jsoncheck-ci.kubeconfig" >> "$GITHUB_ENV"

      - name: Создание временного Kubernetes-кластера
        run: |
          kind version
          kind create cluster --name jsoncheck-ci --wait 180s

          kubectl version
          kubectl get nodes

      - name: Загрузка Docker-образа в kind
        run: |
          kind load docker-image "$IMAGE" --name jsoncheck-ci

      - name: Развертывание приложения
        run: |
          kubectl apply -f k8s/base/namespace.yaml

          kubectl -n jsoncheck create secret generic jsoncheck-secret \
            --from-literal=APP_API_TOKEN=ci

          OVERLAY="$(mktemp -d k8s/.ci-XXXXXX)"
          trap 'rm -rf "$OVERLAY"' EXIT

          cat > "$OVERLAY/kustomization.yaml" <<EOF
          apiVersion: kustomize.config.k8s.io/v1beta1
          kind: Kustomization
          resources:
            - ../base
          images:
            - name: diss2d/jsoncheck
              newName: jsoncheck-ci
              newTag: "${IMAGE##*:}"
          patches:
            - target:
                kind: Deployment
                name: jsoncheck
              patch: |-
                apiVersion: apps/v1
                kind: Deployment
                metadata:
                  name: jsoncheck
                spec:
                  template:
                    spec:
                      containers:
                        - name: app
                          imagePullPolicy: Never
          EOF

          kubectl apply -k "$OVERLAY"

          kubectl -n jsoncheck rollout status \
            deployment/jsoncheck --timeout=180s

          kubectl -n jsoncheck get deployments,pods,svc

      - name: Проверка health через Kubernetes Service
        run: |
          kubectl -n jsoncheck run probe \
            --image="$IMAGE" \
            --image-pull-policy=Never \
            --restart=Never \
            --command -- sh -ec '
              response=$(curl -fsS --max-time 10 http://jsoncheck/health)
              echo "$response"
              test "$response" = "OK"
            '

          kubectl -n jsoncheck wait \
            --for=jsonpath='{.status.phase}'=Succeeded \
            pod/probe --timeout=90s

          kubectl -n jsoncheck logs probe

          echo "Kubernetes Service health check passed"

      - name: Диагностика при ошибке
        if: failure()
        run: |
          kubectl get pods -A -o wide || true
          kubectl -n jsoncheck describe pods || true
          kubectl -n jsoncheck logs -l app=jsoncheck --all-containers=true || true
          kubectl -n jsoncheck logs probe || true
          kubectl get events -A --sort-by=.lastTimestamp || true

      - name: Удаление временного Kubernetes-кластера
        if: always()
        run: |
          kind delete cluster --name jsoncheck-ci

  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      - name: Получение репозитория и Git-тегов
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Скачивание Debian-пакета
        uses: actions/download-artifact@v8
        with:
          name: deb
          path: dist

      - name: Проверка скачанного пакета
        run: ls -lh dist/*.deb
      - name: Создание GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/*.deb \
            --verify-tag \
            --title "jsoncheck $RELEASE_TAG" \
            --notes-from-tag

  deploy:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04

    steps:
      - name: Получение исходного кода
        uses: actions/checkout@v7

      - name: Скачивание Debian-пакета
        uses: actions/download-artifact@v8
        with:
          name: deb
          path: dist

      - name: Подготовка имени и тегов образа
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          test -n "$DOCKERHUB_USERNAME"

          APP_VERSION="$(cat VERSION)"
          test "$GITHUB_REF_NAME" = "v$APP_VERSION"

          echo "IMAGE=$DOCKERHUB_USERNAME/jsoncheck" >> "$GITHUB_ENV"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - name: Сборка Docker-образа
        run: |
          docker build \
            --build-arg APP_VERSION="$APP_VERSION" \
            -t "$IMAGE:$APP_VERSION" \
            -t "$IMAGE:$SHORT_SHA" .
      - name: Smoke-тест контейнера
        run: |
          docker run -d \
            --name jsoncheck-smoke \
            -p 8080:8080 \
            -e APP_API_TOKEN=ci \
            "$IMAGE:$APP_VERSION"

          trap 'docker logs jsoncheck-smoke; docker rm -f jsoncheck-smoke >/dev/null' EXIT

          for attempt in {1..15}; do
            if curl -fsS http://127.0.0.1:8080/health; then
              break
            fi

            if [ "$attempt" -eq 15 ]; then
              exit 1
            fi

            sleep 1
          done

          response=$(curl -fsS \
            -H "X-Api-Token: ci" \
            --data-binary '{"ok":true}' \
            http://127.0.0.1:8080/api/validate)

          test "$response" = "JSON is valid"

      - name: Вход в Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Публикация Docker-образа
        run: |
          docker push "$IMAGE:$APP_VERSION"
          docker push "$IMAGE:$SHORT_SHA"
