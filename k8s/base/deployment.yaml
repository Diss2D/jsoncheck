apiVersion: apps/v1
kind: Deployment
metadata:
  name: jsoncheck
  namespace: jsoncheck
spec:
  replicas: 2
  minReadySeconds: 5
  selector:
    matchLabels:
      app: jsoncheck
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: jsoncheck
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
      containers:
        - name: app
          image: diss2d/jsoncheck:1.0.1
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: jsoncheck-config
            - secretRef:
                name: jsoncheck-secret
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 64Mi
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 10"]
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
